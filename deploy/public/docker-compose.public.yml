name: laoma-stock-public

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://laoma:${POSTGRES_PASSWORD}@postgres:5432/laoma_stock
      REDIS_URL: redis://redis:6379/0
      LAOMA_STOCK_DATA_DIR: /data
      INTERNAL_DEPLOYMENT: "1"
      COOKIE_SECURE: "1"
      LAOMA_ADMIN_USER: ${LAOMA_ADMIN_USER:-laoma}
      LAOMA_ADMIN_PASSWORD: ${LAOMA_ADMIN_PASSWORD}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
    expose:
      - "8787"
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: laoma_stock
      POSTGRES_USER: laoma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laoma -d laoma_stock"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
